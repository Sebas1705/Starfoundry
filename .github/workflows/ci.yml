name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly: the slow tier only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses where the build runs: this PC (self-hosted runner, see Sebas1705/ci-runner) when its heartbeat
  # variable is under 3 minutes old, otherwise a GitHub-hosted runner. Pull requests never use the PC.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.PC_RUNNER_HEARTBEAT }}
          EVENT: ${{ github.event_name }}
        run: |
          runner='"ubuntu-latest"'
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ -n "${HEARTBEAT:-}" ]; then
            age=$(( $(date +%s) - HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 180 ]; then runner='["self-hosted","pc"]'; fi
          fi
          echo "Runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  # Fast tier (tests without the Slow trait), the Godot project build and the benchmark. Skipped on the nightly run.
  fast:
    name: Fast tests, build and benchmark
    if: github.event_name != 'schedule'
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test simulation (fast tier)
        run: dotnet test -c Release --filter "Tier!=Slow"

      - name: Build Godot project
        run: dotnet build game -c Debug

      - name: Simulation benchmark (fails if p99 tick exceeds the 30 UPS budget)
        run: dotnet run -c Release --project tools/Starfoundry.Bench

  # Slow tier: bot runs, brute-force walks and long replays (tests with [Trait("Tier", "Slow")]). Runs in parallel with `fast`.
  slow:
    name: Slow tests
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test simulation (slow tier)
        run: dotnet test -c Release --filter "Tier=Slow"

  # The required status check (branch protection): passes only when both tiers pass (fast is skipped on the nightly run).
  build-and-test:
    name: build-and-test
    if: always()
    needs: [fast, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both tiers
        env:
          FAST: ${{ needs.fast.result }}
          SLOW: ${{ needs.slow.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "fast=$FAST slow=$SLOW"
          [ "$SLOW" = success ] || exit 1
          if [ "$EVENT" = schedule ]; then [ "$FAST" = skipped ]; else [ "$FAST" = success ]; fi
